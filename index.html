<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Simple To-Do List - Görevlerinizi kolayca yönetin">
    <title>Simple To-Do List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header Section -->
        <header class="app-header">
            <h1 class="app-title">Yapılacaklar</h1>
            <p class="app-subtitle">Görevlerini organize et, verimli ol.</p>
        </header>

        <!-- Add Todo Section -->
        <section class="add-todo-section">
            <form id="todoForm" class="todo-form">
                <input 
                    type="text" 
                    id="todoInput" 
                    class="todo-input" 
                    placeholder="Yeni görev ekle..."
                    autocomplete="off"
                    maxlength="150"
                    aria-label="Yeni görev ekle"
                >
                <button type="submit" class="btn btn-add" aria-label="Görev ekle">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>Ekle</span>
                </button>
            </form>
        </section>

        <!-- Filters Section -->
        <section class="filters-section">
            <div class="filter-buttons" role="tablist" aria-label="Görev filtreleri">
                <button 
                    class="filter-btn active" 
                    data-filter="all" 
                    role="tab" 
                    aria-selected="true"
                >
                    Tümü
                </button>
                <button 
                    class="filter-btn" 
                    data-filter="active" 
                    role="tab" 
                    aria-selected="false"
                >
                    Aktif
                </button>
                <button 
                    class="filter-btn" 
                    data-filter="completed" 
                    role="tab" 
                    aria-selected="false"
                >
                    Tamamlanan
                </button>
            </div>
            <div class="todo-stats">
                <span id="todoCount" class="todo-count">0 görev</span>
            </div>
        </section>

        <!-- Todo List Section -->
        <section class="todo-list-section">
            <ul id="todoList" class="todo-list" aria-label="Görev listesi">
                <!-- Todo items will be rendered here -->
            </ul>
            <div id="emptyState" class="empty-state">
                <div class="empty-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                        <path d="M9 14l2 2 4-4"></path>
                    </svg>
                </div>
                <p class="empty-text">Henüz görev eklenmedi</p>
                <p class="empty-hint">Yukarıdaki alana yazarak ilk görevini ekle</p>
            </div>
        </section>

        <!-- Footer Section -->
        <footer class="app-footer">
            <button id="clearCompleted" class="btn btn-clear" aria-label="Tamamlananları temizle">
                Tamamlananları Temizle
            </button>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
