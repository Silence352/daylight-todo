<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="待办 · 晨光 Daily Dashboard —— 项目导航、今日焦点与任务流、工作节奏洞察">
    <title>待办 · 晨光</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container dashboard">
        <!-- Header Section -->
        <header class="app-header">
            <div class="lang-switch" role="group" data-i18n-aria="aria.langSwitch">
                <button type="button" class="lang-btn active" data-lang="zh" aria-pressed="true" aria-label="切换到中文">中</button>
                <button type="button" class="lang-btn" data-lang="en" aria-pressed="false" aria-label="Switch to English">EN</button>
            </div>
            <div class="auth-entry" role="group">
                <button type="button" id="authBtn" class="auth-btn" data-i18n="account.signInToSync" data-i18n-aria="aria.authBtn">
                    登录以同步
                </button>
                <button type="button" id="authLogoutBtn" class="auth-btn auth-logout-btn hidden" data-i18n="account.signOut" data-i18n-aria="account.signOut">
                    退出
                </button>
            </div>
            <h1 class="app-title" data-i18n="app.title">待办</h1>
            <p class="app-subtitle" data-i18n="app.subtitle">规划你的任务，从容开启每一天。</p>

            <!-- Account modal (login / register) -->
            <div id="authModal" class="auth-modal hidden" role="dialog" aria-modal="true" aria-labelledby="authModalTitle">
                <div class="auth-modal-card">
                    <button type="button" class="auth-close" data-auth-action="close" data-i18n-aria="aria.authClose" aria-label="关闭对话框">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                    <h2 id="authModalTitle" class="auth-modal-title" data-i18n="account.authModalTitle">账号</h2>
                    <div class="auth-tabs" role="tablist" aria-label="账号">
                        <button type="button" class="auth-tab active" data-auth-tab="login" role="tab" aria-selected="true" data-i18n="account.loginTab">登录</button>
                        <button type="button" class="auth-tab" data-auth-tab="register" role="tab" aria-selected="false" data-i18n="account.registerTab">注册</button>
                    </div>
                    <p id="authError" class="auth-error" role="alert"></p>
                    <!-- Login form -->
                    <form id="authLoginForm" class="auth-form" data-auth-mode="login" novalidate>
                        <div class="auth-field">
                            <label for="authLoginEmail" data-i18n="account.email">邮箱</label>
                            <input
                                type="email"
                                id="authLoginEmail"
                                name="email"
                                autocomplete="email"
                                required
                                placeholder="邮箱"
                                data-i18n-placeholder="account.email"
                                data-i18n-aria="aria.authEmail"
                                aria-label="邮箱输入"
                            >
                        </div>
                        <div class="auth-field">
                            <label for="authLoginPassword" data-i18n="account.password">密码</label>
                            <input
                                type="password"
                                id="authLoginPassword"
                                name="password"
                                autocomplete="current-password"
                                required
                                placeholder="密码"
                                data-i18n-placeholder="account.password"
                                data-i18n-aria="aria.authPassword"
                                aria-label="密码输入"
                            >
                        </div>
                        <button type="submit" class="auth-submit" data-i18n="account.signIn" data-i18n-aria="aria.authSubmit" aria-label="提交">
                            登录
                        </button>
                    </form>
                    <!-- Register form -->
                    <form id="authRegisterForm" class="auth-form hidden" data-auth-mode="register" novalidate>
                        <div class="auth-field">
                            <label for="authRegEmail" data-i18n="account.email">邮箱</label>
                            <input
                                type="email"
                                id="authRegEmail"
                                name="email"
                                autocomplete="email"
                                required
                                placeholder="邮箱"
                                data-i18n-placeholder="account.email"
                                data-i18n-aria="aria.authEmail"
                                aria-label="邮箱输入"
                            >
                        </div>
                        <div class="auth-field">
                            <label for="authRegPassword" data-i18n="account.password">密码</label>
                            <input
                                type="password"
                                id="authRegPassword"
                                name="password"
                                autocomplete="new-password"
                                required
                                placeholder="密码"
                                data-i18n-placeholder="account.password"
                                data-i18n-aria="aria.authPassword"
                                aria-label="密码输入"
                            >
                        </div>
                        <div class="auth-field">
                            <label for="authRegConfirm" data-i18n="account.confirmPassword">确认密码</label>
                            <input
                                type="password"
                                id="authRegConfirm"
                                name="confirmPassword"
                                autocomplete="new-password"
                                required
                                placeholder="确认密码"
                                data-i18n-placeholder="account.confirmPassword"
                                data-i18n-aria="aria.authConfirmPassword"
                                aria-label="确认密码输入"
                            >
                        </div>
                        <button type="submit" class="auth-submit" data-i18n="account.signUp" data-i18n-aria="aria.authSubmit" aria-label="提交">
                            注册
                        </button>
                    </form>
                </div>
            </div>
        </header>

        <div class="dashboard-grid">
            <!-- Left column: project navigation -->
            <aside id="projectNav" class="panel project-nav">
                <h2 class="panel-title" data-i18n="nav.title">项目导航</h2>
                <ul id="navEntryList" class="nav-entry-list" aria-label="项目列表" data-i18n-aria="aria.projectList">
                    <!-- Navigation entries rendered by app.js -->
                </ul>
                <form id="projectForm" class="project-form">
                    <input
                        type="text"
                        id="projectInput"
                        class="project-input"
                        maxlength="30"
                        autocomplete="off"
                        placeholder="新建项目…"
                        aria-label="项目名称输入"
                        data-i18n-placeholder="nav.newProjectPlaceholder"
                        data-i18n-aria="aria.projectInput"
                    >
                    <button type="submit" class="btn btn-project-add" aria-label="添加项目" data-i18n-aria="aria.addProject" data-i18n="nav.addProject">
                        添加
                    </button>
                </form>
                <p id="projectError" class="form-error" role="alert"></p>
            </aside>

            <!-- Center column: quick add, detail form, filters, focus, task flow -->
            <main id="mainColumn" class="main-column">
                <section class="quick-add-section">
                    <form id="todoForm" class="todo-form">
                        <input
                            type="text"
                            id="todoInput"
                            class="todo-input"
                            placeholder="添加新任务…"
                            autocomplete="off"
                            maxlength="150"
                            aria-label="添加新任务"
                            data-i18n-placeholder="placeholder.addTask"
                            data-i18n-aria="aria.addInput"
                        >
                        <button type="button" id="openDetailForm" class="btn btn-detail" aria-label="打开详细添加表单" data-i18n-aria="aria.openDetailForm" data-i18n="form.openDetail">
                            详细添加
                        </button>
                        <button type="button" id="extractBtn" class="btn btn-extract" aria-label="智能拆解当前输入" data-i18n-aria="aria.extractAction" data-i18n="extraction.action">
                            智能拆解
                        </button>
                        <button type="submit" class="btn btn-add" aria-label="添加任务" data-i18n-aria="aria.add">
                            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                            <span data-i18n="btn.add">添加</span>
                        </button>
                    </form>
                </section>

                <section id="detailFormSection" class="detail-form-section hidden" aria-label="任务详细表单" data-i18n-aria="aria.taskForm">
                    <!-- Detail add/edit form rendered by app.js -->
                </section>

                <section id="extractionResults" class="extraction-section hidden" aria-label="智能拆解结果区" data-i18n-aria="aria.extractionResults">
                    <!-- Draft cards rendered by app.js -->
                </section>

                <section class="filters-section">
                    <div class="filter-buttons" role="tablist" aria-label="任务筛选" data-i18n-aria="aria.filters">
                        <button
                            class="filter-btn active"
                            data-filter="all"
                            role="tab"
                            aria-selected="true"
                            data-i18n="filter.all"
                        >
                            全部
                        </button>
                        <button
                            class="filter-btn"
                            data-filter="active"
                            role="tab"
                            aria-selected="false"
                            data-i18n="filter.active"
                        >
                            进行中
                        </button>
                        <button
                            class="filter-btn"
                            data-filter="completed"
                            role="tab"
                            aria-selected="false"
                            data-i18n="filter.completed"
                        >
                            已完成
                        </button>
                    </div>
                    <div class="todo-stats">
                        <span id="todoCount" class="todo-count">0 项任务</span>
                    </div>
                </section>

                <section id="focusSection" class="focus-section">
                    <h2 class="section-title" data-i18n="focus.title">今日焦点</h2>
                    <div id="focusPanel" class="focus-panel" aria-label="今日焦点区" data-i18n-aria="aria.focusPanel">
                        <!-- Focus items rendered by app.js -->
                    </div>
                </section>

                <section class="todo-list-section">
                    <ul id="todoList" class="todo-list" aria-label="任务列表" data-i18n-aria="aria.todoList">
                        <!-- Todo items will be rendered here -->
                    </ul>
                    <div id="emptyState" class="empty-state">
                        <div class="empty-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                                <path d="M9 14l2 2 4-4"></path>
                            </svg>
                        </div>
                        <p class="empty-text">还没有任务</p>
                        <p class="empty-hint">在上方输入框写下你的第一个任务吧</p>
                    </div>
                </section>

                <footer class="app-footer">
                    <button id="clearCompleted" class="btn btn-clear" aria-label="清除已完成任务" data-i18n="btn.clearCompleted" data-i18n-aria="aria.clearCompleted">
                        清除已完成
                    </button>
                </footer>
            </main>

            <!-- Right column: pace & insights -->
            <aside id="insightPanel" class="panel insight-panel">
                <h2 class="panel-title" data-i18n="insight.title">工作节奏</h2>
                <h3 class="insight-subtitle" data-i18n="insight.todayProgress">今日进度</h3>
                <div class="progress-ring" id="progressRing" role="img" aria-label="今日进度 0%，已完成 0 项，共 0 项">
                    <svg viewBox="0 0 120 120" aria-hidden="true" focusable="false">
                        <circle class="ring-track" cx="60" cy="60" r="52"></circle>
                        <circle class="ring-progress" id="ringProgress" cx="60" cy="60" r="52"></circle>
                    </svg>
                    <span class="ring-center" id="ringPercent">0%</span>
                </div>
                <p class="ring-summary" id="ringSummary">已完成 0 · 共 0</p>
                <p class="done-left-summary" id="doneLeftSummary">0 已完成 · 0 剩余</p>
                <ul class="insight-list" aria-label="洞察指标" data-i18n-aria="aria.insightList">
                    <li class="insight-item">
                        <span class="insight-label" data-i18n="insight.doneToday">今日完成</span>
                        <span class="insight-value" id="insightDoneToday">0</span>
                    </li>
                    <li class="insight-item">
                        <span class="insight-label" data-i18n="insight.overdue">逾期未完成</span>
                        <span class="insight-value" id="insightOverdue">0</span>
                    </li>
                    <li class="insight-item">
                        <span class="insight-label" data-i18n="insight.highOpen">高优先级待办</span>
                        <span class="insight-value" id="insightHighOpen">0</span>
                    </li>
                </ul>
            </aside>
        </div>

        <!-- Cloud workspace (shown only when signed in) -->
        <section id="cloudWorkspaceSection" class="cloud-workspace-section hidden" aria-label="云端工作区" data-i18n-aria="aria.cloudTaskList">
            <header class="cloud-workspace-header">
                <h2 class="panel-title" data-i18n="account.cloudWorkspace">云端工作区</h2>
                <div class="cloud-workspace-actions">
                    <button type="button" id="syncBtn" class="sync-btn hidden" data-i18n="sync.action" data-i18n-aria="aria.syncAction" aria-label="同步本地任务到云端">
                        同步本地任务
                    </button>
                    <span class="cloud-workspace-hint" data-i18n="account.noCloudTasks">暂无云端任务</span>
                </div>
            </header>

            <!-- v6 Local-to-Cloud Sync confirmation card (inline, shown after clicking syncBtn) -->
            <div id="syncConfirmCard" class="sync-confirm-card hidden" role="dialog" aria-modal="false" aria-labelledby="syncConfirmTitle" data-i18n-aria="aria.syncConfirmCard">
                <button type="button" class="sync-close" data-sync-action="close" data-i18n-aria="aria.syncClose" aria-label="关闭同步确认卡">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
                <h3 id="syncConfirmTitle" class="sync-confirm-title" data-i18n="sync.confirmTitle">确认同步到云端</h3>
                <p id="syncConfirmHint" class="sync-confirm-hint"></p>
                <p id="syncError" class="sync-error" role="alert"></p>
                <div class="sync-confirm-actions">
                    <button type="button" id="syncConfirmBtn" class="sync-confirm-btn" data-sync-action="confirm" data-i18n="sync.confirm" data-i18n-aria="aria.syncConfirm" aria-label="确认同步">
                        确认同步
                    </button>
                    <button type="button" id="syncCancelBtn" class="sync-cancel-btn" data-sync-action="cancel" data-i18n="sync.cancel" data-i18n-aria="aria.syncCancel" aria-label="取消同步">
                        取消
                    </button>
                </div>
            </div>

            <ul id="cloudTaskList" class="cloud-task-list" aria-label="云端任务列表" data-i18n-aria="aria.cloudTaskList">
                <!-- Cloud tasks rendered by app.js -->
            </ul>
        </section>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
